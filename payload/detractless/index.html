<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Tab</title>
    <link rel="stylesheet" href="src/styles/fonts.css">
    <link rel="stylesheet" href="src/dist/newtab.bundle.css">
    <!-- Theme first, then scale. themePreinit defines the ref-counted page hold
         that preinit uses, so the order is load-bearing, not stylistic. -->
    <script src="src/pages/shared/themePreinit.js"></script>
    <script src="src/pages/newtab/preinit.js"></script>
    <script src="src/pages/newtab/profilesCore.js"></script>
    <link rel="stylesheet" href="src/pages/newtab/profilesPage.css">
</head>

<body class="theme-dark">
    <div id="app">
        <!-- The switcher button and menu are built by tabs logic (R-013);
             this is the positioned host it renders into. -->
        <div class="switcher" id="tabs-container"></div>

        <div id="search-page" class="page active">
          <div id="home-grid">
            <div id="spotlight-wrapper">
                <div class="spotlight-search-container">
                    <div class="search-icon">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.34-4.34"/></svg>
                    </div>
                    <div class="search-input-wrapper">
                        <!-- The placeholder carries the Shift+Enter hint because
                             that override is otherwise invisible: plain Enter
                             opens a matching bookmark, and nothing on screen says
                             how to search for text that matches one, or for
                             something URL-shaped like "notes.io". A placeholder
                             only shows while the field is EMPTY, so it teaches
                             on arrival rather than at the moment of need, which
                             is the honest limit of putting it here. -->
                        <input type="text" id="search-input" placeholder="Search the web, or Shift+Enter to force a search" autocomplete="off">
                    </div>

                    <div class="plus" id="plus">
                        <div class="current-engine-icon-display" id="current-engine-icon-display">
                            <img src="src/assets/svg/default.api.svg" alt="Default" width="20" height="20">
                        </div>
                    </div>
                    <div id="engine-links"></div>
                    <div id="bookmark-pills-wrapper">
                        <!-- The fade and hidden-pill count are injected around this
                             list by the shared scroll affordance (R-010). There used
                             to be a hand-rolled #bookmark-fade-overlay here. -->
                        <div id="bookmark-search-results" class="bookmark-search-results" style="display: none;"></div>
                    </div>
                </div>

            </div>

          </div>
        </div>

        <div id="bookmarks-page" class="page">
            <div id="bookmarks-content" class="bookmarks-content">
            </div>
        </div>
    </div>

    <!-- Dock-style discs (UI-RULES 4): card-fill circles with an icon, the
         launcher DockIcon carried to the web. -->
    <div class="action-buttons" id="global-actions">
        <!-- The + button opens the add popup (components/addPopup), one dialog
             for a bookmark or a page. -->
        <div class="add-menu" id="add-menu">
            <button class="action-btn" id="global-add-btn" title="Add page or bookmark"
                    aria-label="Add page or bookmark" aria-expanded="false" aria-haspopup="dialog">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
            </button>
        </div>
        <span class="action-divider"></span>
        <button class="action-btn" id="global-settings-btn" title="Settings" aria-label="Settings">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15.5A3.5 3.5 0 1 0 12 8.5a3.5 3.5 0 0 0 0 7Z"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33h.01a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51h.01a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82v.01a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z"/></svg>
        </button>
    </div>


    <div id="engine-modal" class="modal" data-no-backdrop-close>
        <div class="settings-container">
            <div class="settings-header">
                <h1 id="engine-modal-title">Search Engines</h1>
                <button class="close-btn" id="close-engine-modal" title="Close">×</button>
            </div>
            <div class="settings-body">

                <!-- Home: engine list -->
                <div id="engine-home">
                    <div class="settings-section-header" style="margin-top: 4px;">Add</div>
                    <div class="settings-group">
                        <button class="settings-row" type="button" id="add-engine-btn">
                            <span class="settings-row-text">
                                <span class="settings-row-title">Add new engine</span>
                            </span>
                            <span class="settings-row-chevron" aria-hidden="true"></span>
                        </button>
                    </div>
                    <div class="settings-section-header">Your Engines</div>
                    <div class="settings-group" id="engine-list-container"></div>
                </div>

                <!-- Sub-page: Add Engine -->
                <!-- Sub-page: Add Engine -->
                <div class="engine-subpage" data-engine-panel="add" data-engine-title="Add Engine" hidden>
                    <div class="settings-section-header" style="margin-top: 4px;">Name</div>
                    <input type="text" class="form-input engine-field" id="engine-add-name" placeholder="e.g. Google" autocomplete="off">
                    <div class="settings-section-header">Search URL</div>
                    <input type="url" class="form-input engine-field" id="engine-add-url" placeholder="https://example.com/search?q=%s" autocomplete="off">
                    <div class="settings-section-header">Icon</div>
                    <div class="settings-group">
                        <button class="settings-row" style="border-radius: 16px;" type="button" id="engine-add-icon-row">
                            <span class="settings-row-text">
                                <span class="settings-row-title">Icon type</span>
                                <span class="settings-row-value" id="engine-add-icon-label">Upload SVG</span>
                            </span>
                            <span class="settings-row-chevron" aria-hidden="true"></span>
                        </button>
                    </div>
                    <p class="picker-error" id="engine-add-error" style="padding: 6px 0 0; font-size: 13px;"></p>
                    <div style="margin-top: 20px;">
                        <button class="save-btn" id="engine-add-submit" style="width: 100%;" type="button">Add Engine</button>
                    </div>
                </div>




            </div>
            <div class="settings-footer">
                <div class="footer-buttons" style="margin-left: auto;">
                    <button class="save-btn" id="save-engines">Close</button>
                </div>
            </div>
        </div>
    </div>


    <script src="src/dist/newtab.bundle.js"></script>
    <!-- Atlas's right-click menu (installed beside the new tab by install.py step 1). -->
    <script src="components/atlas/atlas-menu.js"></script>
    <script src="src/pages/newtab/profilesPage.js"></script>
    <script src="src/pages/newtab/profileEditPage.js"></script>
    <script src="src/pages/newtab/newtabBridge.js"></script>
</body>

</html>
