<!DOCTYPE html>
<html data-theme="dark">
<head>
  <title>Search Delay</title>
  <link rel="stylesheet" href="src/styles/fonts.css">
  <link rel="stylesheet" href="src/dist/gate.bundle.css">
</head>
<body class="theme-dark">
  <div class="container">
    <div id="timer-container">
      <div class="lds-facebook gate-loader">
        <div></div>
        <div></div>
        <div></div>
      </div>
      <div class="countdown">
        <span id="time-remaining">300</span>
      </div>
    </div>
    
    <div id="reveal-container" class="gate-hidden">
      <p class="gate-reveal-copy">Time's up! Click the button to reveal your search results.</p>
      <button id="reveal-button">Reveal Results</button>
    </div>
  </div>

  <!-- Block page for "Block social sites entirely" (gate.js shows it when the address says ?why=social) -->
  <div class="container gate-hidden" id="social-container">
    <p id="social-title" class="gate-social-title">Blocked</p>
    <p id="social-text" class="gate-social-text">Social sites are blocked.</p>
  </div>

  <!-- Query Display (hidden by default, shown if option is enabled) -->
  <div class="query-display gate-hidden" id="query-display">
    <img class="engine-icon" id="engine-icon" src="" alt="">
    <div class="query-separator"></div>
    <span class="query-label">Searching:</span>
    <span class="query-text" id="query-text">Loading...</span>
    <span class="engine-name" id="engine-name">on Google</span>
  </div>

  <script src="src/dist/gate.bundle.js"></script>
</body>
</html>
